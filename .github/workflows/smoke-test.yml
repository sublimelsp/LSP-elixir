name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lets an organization variable choose the LSP ref to test against, see
      # https://github.com/sublimelsp/lsp_smoke_test#testing-against-an-lsp-branch
      LSP_SMOKE_TEST_LSP_REF: ${{ vars.LSP_SMOKE_TEST_LSP_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20'

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Elixir syntax, which Sublime Text doesn't include.
          extra-packages: princemaple/elixir-sublime-syntax@v
