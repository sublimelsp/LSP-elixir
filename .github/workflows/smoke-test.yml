name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.20'

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Elixir syntax, which Sublime Text doesn't include.
          extra-packages: princemaple/elixir-sublime-syntax@v
